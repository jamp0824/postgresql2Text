[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg2text"
version = "0.1.0"
description = "자연어로 PostgreSQL 데이터를 조회하고 대화형으로 문서를 작성하는 도구"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "postgresql2Text" }]

dependencies = [
    # LLM / AI
    "google-genai>=1.72.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",

    # Document generation
    "python-docx>=1.1.0",
    "markdown2>=2.4.0",
    "jinja2>=3.1.0",

    # CLI / UX
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",

    # Config / Utils
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
pg2text = "pg2text.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
